
name: "✨ 功能 / 改进"
description: "新增能力、优化现有功能或提出明确的改进任务"
title: "[Feature] <请在此处输入简要描述>"
body:
  - type: markdown
    attributes:
      value: |
        请写清目的与完成条件；由你实现时，先确认仓库写权限，再按下方流程建分支

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 希望最终实现什么？
      placeholder: 例如：让底盘能够根据导航目标自动切换控制模式
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景 / 原因
      description: 为什么需要做这件事？现状有什么问题？
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足什么条件可以认为任务完成？
      placeholder: |
        - [ ] 条件 1
        - [ ] 条件 2
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 涉及模块 / 影响范围
      description: 可能涉及哪些包、模块、硬件、接口或文档？

  - type: textarea
    id: references
    attributes:
      label: 补充资料
      description: 可附设计图、日志、相关 Issue / PR / 文档链接等

  - type: markdown
    attributes:
      value: |
        ### 创建后怎么开始开发
        1. 推荐流程：**Issue → 确认 Write → Branch → Commit → Push → Pull Request → 项目负责人 Merge**
        2. 已有仓库写权限可直接继续；没有则联系负责人或管理员开通 Write，如有邀请先接受
        3. 权限生效后，从 Issue 的 `Development` 创建分支，或在本地建分支、推送后关联 Issue
        4. 推荐分支名：`feat/xxx`；这是协作约定，不做硬性拦截
        5. 请勿直接在 `main` 开发或 Push
        6. 如果已经误在 `main` 上产生了有用 Commit，**不要先 `reset --hard`**，先按协作指南把提交保存到新分支
