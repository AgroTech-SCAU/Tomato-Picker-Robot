
name: "📋 一般任务"
description: "实验、标定、测试、部署、文档、代码整理等明确任务"
title: "[Task] <请在此处输入简要描述>"
body:
  - type: textarea
    id: task
    attributes:
      label: 任务内容
      description: 需要完成什么？
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 背景 / 输入
      description: 任务从哪里来？有哪些前置资料或依赖？

  - type: textarea
    id: done
    attributes:
      label: 完成条件
      placeholder: |
        - [ ] 输出 / 结果 1
        - [ ] 输出 / 结果 2
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充说明 / 风险

  - type: markdown
    attributes:
      value: |
        ### 如果本任务需要修改仓库
        1. 推荐流程：**Issue → 确认 Write → Branch → Commit → Push → Pull Request → 项目负责人 Merge**
        2. 已有仓库写权限可直接继续；没有则联系负责人或管理员开通 Write，如有邀请先接受
        3. 权限生效后，从 Issue 的 `Development` 创建分支，或在本地建分支、推送后关联 Issue
        4. 推荐分支名：`refactor/xxx`、`docs/xxx` 等；这是协作约定，不做硬性拦截
        5. 请勿直接在 `main` 开发或 Push
        6. 如果已经误在 `main` 上产生了有用 Commit，**不要先 `reset --hard`**，先按协作指南把提交保存到新分支
